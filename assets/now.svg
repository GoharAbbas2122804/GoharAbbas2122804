<svg viewBox="0 0 1000 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Now: Gohar Abbas — Full Stack Web Dev, React Native App Dev, AI ML Engineer, working remotely worldwide">
  <style>
    :root { --bone: #000000; --muted: #333333; --dim: #555555; --rule: #CCCCCC; --accent: #000000; }
    @media (prefers-color-scheme: dark) { :root { --bone: #FFFFFF; --muted: #CCCCCC; --dim: #AAAAAA; --rule: #555555; --accent: #FFFFFF; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
