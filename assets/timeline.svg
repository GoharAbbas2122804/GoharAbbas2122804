<svg viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Route: CS Student &amp; Frontend Dev in 2023, Backend Dev in 2024, Full Stack Dev in 2025, Mobile App Dev in 2026, NOW AI ML Engineer">
  <style>
    :root { --bone: #000000; --muted: #333333; --dim: #555555; --rule: #CCCCCC; --accent: #000000; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .axis { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 1110; stroke-dashoffset: 1110; animation: draw 2.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .m { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .m1{animation-delay:.4s}.m2{animation-delay:.8s}.m3{animation-delay:1.2s}.m4{animation-delay:1.6s}.m5{animation-delay:2.0s}
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring { animation: ring 2.6s ease-out infinite; transform-origin: 1060px 125px; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(3);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .axis,.m,.pulse,.ring { animation: none; } .axis{stroke-dashoffset:0} .m{opacity:1} .ring{opacity:0}
    }
  </style>

  <line x1="48" y1="40" x2="1152" y2="40" stroke="var(--rule)" stroke-width="1.5"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="12.5" font-weight="800" letter-spacing="3.5">THE ROUTE SO FAR — CAREER JOURNEY</text>
  <text fill="var(--muted)" class="mono" x="1152" y="28" font-size="12.5" font-weight="800" letter-spacing="3.5" text-anchor="end">FIG. 03</text>

  <line class="axis" x1="48" y1="125" x2="1158" y2="125"/>

  <!-- 2023 -->
  <g class="m m1">
    <circle cx="120" cy="125" r="4.5" fill="var(--bone)"/>
    <line x1="120" y1="121" x2="120" y2="96" stroke="var(--rule)" stroke-width="1.5"/>
    <text fill="var(--accent)" class="mono" x="120" y="68" font-size="14" font-weight="800" letter-spacing="2" text-anchor="middle">2023</text>
    <text fill="var(--bone)" class="mono" x="120" y="86" font-size="13" font-weight="700" text-anchor="middle">CS Student · Frontend Dev</text>
    <text fill="var(--muted)" class="mono" x="120" y="102" font-size="11.5" font-weight="500" text-anchor="middle">Started CS Degree &amp; HTML/CSS/JS</text>
  </g>

  <!-- 2024 -->
  <g class="m m2">
    <circle cx="360" cy="125" r="4.5" fill="var(--bone)"/>
    <line x1="360" y1="129" x2="360" y2="154" stroke="var(--rule)" stroke-width="1.5"/>
    <text fill="var(--accent)" class="mono" x="360" y="172" font-size="14" font-weight="800" letter-spacing="2" text-anchor="middle">2024</text>
    <text fill="var(--bone)" class="mono" x="360" y="190" font-size="13" font-weight="700" text-anchor="middle">Backend Development</text>
    <text fill="var(--muted)" class="mono" x="360" y="206" font-size="11.5" font-weight="500" text-anchor="middle">Node.js · Express · Python APIs · Databases</text>
  </g>

  <!-- 2025 -->
  <g class="m m3">
    <circle cx="600" cy="125" r="4.5" fill="var(--bone)"/>
    <line x1="600" y1="121" x2="600" y2="96" stroke="var(--rule)" stroke-width="1.5"/>
    <text fill="var(--accent)" class="mono" x="600" y="68" font-size="14" font-weight="800" letter-spacing="2" text-anchor="middle">2025</text>
    <text fill="var(--bone)" class="mono" x="600" y="86" font-size="13" font-weight="700" text-anchor="middle">Full Stack Developer</text>
    <text fill="var(--muted)" class="mono" x="600" y="102" font-size="11.5" font-weight="500" text-anchor="middle">MERN Stack · Next.js · End-to-End Apps</text>
  </g>

  <!-- 2026 -->
  <g class="m m4">
    <circle cx="840" cy="125" r="4.5" fill="var(--bone)"/>
    <line x1="840" y1="129" x2="840" y2="154" stroke="var(--rule)" stroke-width="1.5"/>
    <text fill="var(--accent)" class="mono" x="840" y="172" font-size="14" font-weight="800" letter-spacing="2" text-anchor="middle">2026</text>
    <text fill="var(--bone)" class="mono" x="840" y="190" font-size="13" font-weight="700" text-anchor="middle">Mobile App Developer</text>
    <text fill="var(--muted)" class="mono" x="840" y="206" font-size="11.5" font-weight="500" text-anchor="middle">Cross-Platform React Native &amp; Flutter</text>
  </g>

  <!-- NOW -->
  <g class="m m5">
    <circle class="ring" cx="1060" cy="125" r="5" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
    <circle class="pulse" cx="1060" cy="125" r="5" fill="var(--accent)"/>
    <line x1="1060" y1="121" x2="1060" y2="96" stroke="var(--rule)" stroke-width="1.5"/>
    <text fill="var(--accent)" class="mono" x="1060" y="68" font-size="14" font-weight="800" letter-spacing="2" text-anchor="middle">NOW</text>
    <text fill="var(--bone)" class="mono" x="1060" y="86" font-size="13" font-weight="700" text-anchor="middle">AI / ML Engineer</text>
    <text fill="var(--muted)" class="mono" x="1060" y="102" font-size="11.5" font-weight="500" text-anchor="middle">Machine Learning · Deep Learning · AI Systems</text>
  </g>
</svg>
