<svg viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience — Freelance Full Stack, React Native App Dev, AI ML Engineer">
  <style>
    :root { --bone: #FFFFFF; --muted: #CCCCCC; --dim: #AAAAAA; --rule: #555555; --accent: #FFFFFF; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <line x1="120" y1="10" x2="120" y2="290" stroke="var(--rule)" stroke-width="1.5"/>

  <g class="rise a1">
    <text class="mono" x="48" y="42"  font-size="14" font-weight="800" fill="var(--accent)" letter-spacing="2">NOW</text>
    <text class="mono" x="144" y="42"  font-size="17.5" font-weight="800" fill="var(--bone)">Full Stack Web &amp; React Native Mobile Developer · Remote Worldwide</text>
    <text class="mono" x="144" y="68"  font-size="15" font-weight="500" fill="var(--muted)">15+ responsive web &amp; mobile apps · cross-platform React Native · performance optimized</text>
    <text class="mono" x="144" y="90"  font-size="15" font-weight="500" fill="var(--muted)">AI/ML model integration · Docker deployment · GitHub Actions CI/CD pipelines</text>
  </g>

  <g class="rise a2">
    <text class="mono" x="48" y="148" font-size="14" font-weight="800" fill="var(--accent)" letter-spacing="2">2023 – 2025</text>
    <text class="mono" x="144" y="148" font-size="17.5" font-weight="800" fill="var(--bone)">Frontend &amp; Mobile Developer · React &amp; React Native · Remote</text>
    <text class="mono" x="144" y="174" font-size="15" font-weight="500" fill="var(--muted)">built interactive UIs &amp; native mobile screens · reduced load times by 40%</text>
    <text class="mono" x="144" y="196" font-size="15" font-weight="500" fill="var(--muted)">Redux / Context state management · agile collaboration · component-driven architecture</text>
  </g>

  <g class="rise a3">
    <text class="mono" x="48" y="254" font-size="14" font-weight="800" fill="var(--accent)" letter-spacing="2">2024 – 2026</text>
    <text class="mono" x="144" y="254" font-size="17.5" font-weight="800" fill="var(--bone)">AI/ML Engineering &amp; Full Stack Specialization · Certifications</text>
    <text class="mono" x="144" y="280" font-size="15" font-weight="500" fill="var(--muted)">Python AI/ML model deployment · Meta Advanced JS Certified · open-source contributor</text>
  </g>
</svg>
