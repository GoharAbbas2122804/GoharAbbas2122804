<svg viewBox="0 0 1000 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System map: Full-Stack Web, React Native, AI/ML Tech Stack, Databases and Hosting">
  <style>
    :root {
      --bone: #FFFFFF; --muted: #CCCCCC; --dim: #AAAAAA; --rule: #555555;
      --node-bg: #1A1A1A; --core-bg: #222222; --accent: #FFFFFF; --ghost: #FFFFFF;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bone: #000000; --muted: #333333; --dim: #555555; --rule: #CCCCCC;
        --node-bg: #FFFFFF; --core-bg: #FFFFFF; --accent: #000000; --ghost: #000000;
      }
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .node { fill: var(--node-bg); stroke: var(--rule); stroke-width: 1.5; }
    .nodeC { fill: var(--core-bg); stroke: var(--rule); stroke-width: 1.5; }
    .wire { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 500; stroke-dashoffset: 500; animation: draw 1.6s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .w1{animation-delay:.2s}.w2{animation-delay:.32s}.w3{animation-delay:.44s}.w4{animation-delay:.56s}.w5{animation-delay:.68s}.w6{animation-delay:.8s}.w7{animation-delay:.92s}.w8{animation-delay:1.04s}.w9{animation-delay:1.16s}
    .flow { stroke: var(--muted); stroke-width: 1.5; opacity: .4; stroke-dasharray: 4 8; animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -12; } }
    .pop { opacity: 0; animation: pop .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes pop { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .p0{animation-delay:.1s}.p1{animation-delay:.9s}.p2{animation-delay:1.0s}.p3{animation-delay:1.1s}.p4{animation-delay:1.2s}.p5{animation-delay:1.3s}.p6{animation-delay:1.4s}.p7{animation-delay:1.5s}.p8{animation-delay:1.6s}.p9{animation-delay:1.7s}.p10{animation-delay:1.9s}.p11{animation-delay:2.0s}.p12{animation-delay:2.1s}.p13{animation-delay:2.2s}
    @media (prefers-reduced-motion: reduce) {
      .wire,.flow,.pop { animation: none; }
      .wire{stroke-dashoffset:0} .pop{opacity:1} .flow{opacity:.1}
    }
  </style>

  <defs>
    <mask id="node-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="680">
      <rect x="0" y="0" width="1000" height="680" fill="white"/>
      <rect x="405" y="252" width="190" height="56" fill="black"/>
      <rect x="75" y="138" width="180" height="54" fill="black"/>
      <rect x="30" y="268" width="180" height="54" fill="black"/>
      <rect x="85" y="388" width="180" height="54" fill="black"/>
      <rect x="300" y="76" width="180" height="54" fill="black"/>
      <rect x="545" y="83" width="180" height="54" fill="black"/>
      <rect x="755" y="158" width="180" height="54" fill="black"/>
      <rect x="760" y="293" width="180" height="54" fill="black"/>
      <rect x="270" y="438" width="180" height="54" fill="black"/>
      <rect x="630" y="393" width="180" height="54" fill="black"/>
      <rect x="100" y="554" width="180" height="54" fill="black"/>
      <rect x="410" y="525" width="180" height="54" fill="black"/>
      <rect x="720" y="554" width="180" height="54" fill="black"/>
    </mask>
  </defs>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)" stroke-width="1.5"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="12.5" font-weight="800" letter-spacing="3.5">SYSTEM MAP — FULL TECH STACK &amp; ARCHITECTURE</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="12.5" font-weight="800" letter-spacing="3.5" text-anchor="end">FIG. 01</text>

  <g mask="url(#node-cutouts)">
    <line class="wire w1" x1="419" y1="252" x2="244" y2="192"/>
    <line class="wire w2" x1="405" y1="284" x2="210" y2="291"/>
    <line class="wire w3" x1="433" y1="308" x2="240" y2="388"/>
    <line class="wire w4" x1="483" y1="252" x2="407" y2="130"/>
    <line class="wire w5" x1="522" y1="252" x2="614" y2="137"/>
    <line class="wire w6" x1="595" y1="254" x2="755" y2="210"/>
    <line class="wire w7" x1="595" y1="291" x2="760" y2="310"/>
    <line class="wire w8" x1="479" y1="308" x2="380" y2="438"/>
    <line class="wire w9" x1="550" y1="308" x2="678" y2="393"/>
    <line class="wire w9" x1="471" y1="308" x2="218" y2="554"/>
    <line class="wire w9" x1="500" y1="308" x2="500" y2="525"/>
    <line class="wire w9" x1="529" y1="308" x2="782" y2="554"/>
  </g>
  <g mask="url(#node-cutouts)">
    <line class="flow" x1="419" y1="252" x2="244" y2="192"/>
    <line class="flow" x1="405" y1="284" x2="210" y2="291"/>
    <line class="flow" x1="433" y1="308" x2="240" y2="388"/>
    <line class="flow" x1="483" y1="252" x2="407" y2="130"/>
    <line class="flow" x1="522" y1="252" x2="614" y2="137"/>
    <line class="flow" x1="595" y1="254" x2="755" y2="210"/>
    <line class="flow" x1="595" y1="291" x2="760" y2="310"/>
    <line class="flow" x1="479" y1="308" x2="380" y2="438"/>
    <line class="flow" x1="550" y1="308" x2="678" y2="393"/>
    <line class="flow" x1="471" y1="308" x2="218" y2="554"/>
    <line class="flow" x1="500" y1="308" x2="500" y2="525"/>
    <line class="flow" x1="529" y1="308" x2="782" y2="554"/>
  </g>

  <text fill="var(--accent)" class="mono pop p10" x="165" y="118" font-size="11.5" font-weight="800" letter-spacing="3" text-anchor="middle">BACKEND &amp; LANGUAGES</text>
  <text fill="var(--accent)" class="mono pop p10" x="512" y="60" font-size="11.5" font-weight="800" letter-spacing="3" text-anchor="middle">FRONTEND &amp; MOTION</text>
  <text fill="var(--accent)" class="mono pop p10" x="845" y="142" font-size="11.5" font-weight="800" letter-spacing="3" text-anchor="middle">AI / ML &amp; DEEP LEARNING</text>
  <text fill="var(--accent)" class="mono pop p10" x="500" y="603" font-size="11.5" font-weight="800" letter-spacing="3" text-anchor="middle">DATABASES &amp; CLOUD</text>
  <text fill="var(--accent)" class="mono pop p10" x="500" y="625" font-size="11.5" font-weight="800" letter-spacing="3" text-anchor="middle">DEVOPS, GIT &amp; HOSTING</text>

  <g class="pop p0">
    <rect class="nodeC" x="405" y="252" width="190" height="56" rx="2"/>
    <text fill="var(--bone)" class="mono" x="500" y="276" font-size="14" font-weight="800" letter-spacing="2" text-anchor="middle">GOHAR.SYS</text>
    <text fill="var(--muted)" class="mono" x="500" y="294" font-size="10" font-weight="600" letter-spacing="0.5" text-anchor="middle">full-stack &amp; AI build pipeline</text>
  </g>

  <g class="pop p1"><rect class="node" x="75" y="138" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="165" y="161" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">Node &amp; Express</text><text fill="var(--muted)" class="mono" x="165" y="180" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">JS · TS · REST APIs</text></g>
  <g class="pop p2"><rect class="node" x="30" y="268" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="120" y="291" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">FastAPI &amp; Python</text><text fill="var(--muted)" class="mono" x="120" y="310" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">Async APIs · Microservices</text></g>
  <g class="pop p3"><rect class="node" x="85" y="388" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="175" y="411" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">C++ &amp; Systems</text><text fill="var(--muted)" class="mono" x="175" y="430" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">Algorithms · Performance</text></g>
  <g class="pop p4"><rect class="node" x="300" y="76" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="390" y="99" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">Next.js &amp; React.js</text><text fill="var(--muted)" class="mono" x="390" y="118" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">TypeScript · JavaScript</text></g>
  <g class="pop p5"><rect class="node" x="545" y="83" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="635" y="106" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">GSAP &amp; Motion</text><text fill="var(--muted)" class="mono" x="635" y="125" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">Framer Motion · Anime.js</text></g>
  <g class="pop p6"><rect class="node" x="755" y="158" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="845" y="181" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">TensorFlow</text><text fill="var(--muted)" class="mono" x="845" y="200" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">Deep Learning · Neural Nets</text></g>
  <g class="pop p7"><rect class="node" x="760" y="293" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="850" y="316" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">AI / ML Stack</text><text fill="var(--muted)" class="mono" x="850" y="335" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">Python · Models &amp; Training</text></g>
  <g class="pop p8"><rect class="node" x="270" y="438" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="360" y="461" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">MongoDB</text><text fill="var(--muted)" class="mono" x="360" y="480" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">NoSQL · Scalable Schemas</text></g>
  <g class="pop p9"><rect class="node" x="630" y="393" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="720" y="416" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">Supabase &amp; Firebase</text><text fill="var(--muted)" class="mono" x="720" y="435" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">Postgres · Auth · Realtime</text></g>

  <g class="pop p11"><rect class="node" x="100" y="554" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="190" y="577" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">GitHub &amp; Git</text><text fill="var(--muted)" class="mono" x="190" y="596" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">Version Control · CI/CD</text></g>
  <g class="pop p12"><rect class="node" x="410" y="525" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="500" y="548" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">Docker &amp; Vercel</text><text fill="var(--muted)" class="mono" x="500" y="567" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">Containers · Edge Deployment</text></g>
  <g class="pop p13"><rect class="node" x="720" y="554" width="180" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="810" y="577" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">Hostinger</text><text fill="var(--muted)" class="mono" x="810" y="596" font-size="10" font-weight="600" letter-spacing="1" text-anchor="middle">Cloud Server &amp; Hosting</text></g>

  <line x1="48" y1="650" x2="952" y2="650" stroke="var(--rule)" stroke-width="1.5"/>
  <text fill="var(--dim)" class="mono" x="952" y="672" font-size="11" font-weight="700" letter-spacing="2" text-anchor="end">DASHED LINES — DATA IN MOTION</text>
</svg>
