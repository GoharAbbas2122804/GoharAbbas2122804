<svg viewBox="0 0 1000 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 01 — WHOAMI">
  <style>
    :root { --rule: #555555; --muted: #CCCCCC; --accent: #FFFFFF; --ghost: #FFFFFF; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 760; stroke-dashoffset: 760; animation: d 1.3s cubic-bezier(.6,0,.2,1) .2s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .f { opacity: 0; animation: f .8s ease .1s forwards; }
    @keyframes f { to { opacity: 1; } }
    .tick { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%,100%{opacity:1} 50%{opacity:.6} }
    @media (prefers-reduced-motion: reduce) {
      .draw,.f,.tick { animation: none; } .draw { stroke-dashoffset: 0; } .f { opacity: 1; }
    }
  </style>
  <g class="f">
    <text class="mono" x="48" y="70" font-size="64" font-weight="900" fill="var(--ghost)">01</text>
    <text class="mono tick" x="144" y="58" font-size="16" font-weight="800" fill="var(--accent)" letter-spacing="6">WHOAMI</text>
    <text class="mono" x="952" y="58" font-size="13" font-weight="600" fill="var(--muted)" letter-spacing="2" text-anchor="end">~/01-whoami</text>
  </g>
  <line class="draw" x1="264" y1="53" x2="816" y2="53"/>
</svg>