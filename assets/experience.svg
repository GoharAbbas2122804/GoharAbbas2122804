<svg viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience — Freelance Full Stack, Frontend Developer, Certifications">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; --ghost: #000000; }
  </style>

  <line x1="120" y1="10" x2="120" y2="290" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <g class="rise a1">
    <text class="mono" x="48" y="42"  font-size="12" fill="var(--accent)" letter-spacing="2">NOW</text>
    <text class="mono" x="136" y="42"  font-size="15" fill="var(--bone)">Freelance Full Stack Developer · Dubai / Remote</text>
    <text class="mono" x="136" y="68"  font-size="14" fill="var(--muted)">15+ responsive web apps serving 10,000+ users · performance optimized by 40%</text>
    <text class="mono" x="136" y="90"  font-size="14" fill="var(--muted)">Three.js integration · Docker deployment · GitHub Actions CI/CD pipelines</text>
  </g>

  <g class="rise a2">
    <text class="mono" x="48" y="148" font-size="12" fill="var(--accent)" letter-spacing="2">2023 – 2025</text>
    <text class="mono" x="136" y="148" font-size="15" fill="var(--bone)">Frontend Developer · React &amp; Tailwind CSS · Dubai</text>
    <text class="mono" x="136" y="174" font-size="14" fill="var(--muted)">built interactive UIs · reduced load times by 30% · delivered 10+ features ahead of schedule</text>
    <text class="mono" x="136" y="196" font-size="14" fill="var(--muted)">Redux state management · agile collaboration · component-driven architecture</text>
  </g>

  <g class="rise a3">
    <text class="mono" x="48" y="254" font-size="12" fill="var(--accent)" letter-spacing="2">2024</text>
    <text class="mono" x="136" y="254" font-size="15" fill="var(--bone)">Certifications · Meta Advanced JavaScript · MERN Stack · Full Stack Web Dev</text>
    <text class="mono" x="136" y="280" font-size="14" fill="var(--muted)">open-source contributor on GitHub · AI/ML student · continuous upskilling</text>
  </g>
</svg>
