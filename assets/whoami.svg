<svg viewBox="0 0 1000 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — bio, focus, status, certifications">
  <style>
    :root { --bone: #000000; --muted: #444444; --dim: #555555; --rule: #CCCCCC; --accent: #000000; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s} .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <text class="mono rise a1" x="48" y="34" font-size="18" font-weight="700" fill="var(--bone)">Full Stack Web Dev, React Native Mobile Developer, and AI/ML Engineer.</text>
  <text class="mono rise a2" x="48" y="64" font-size="16.5" font-weight="600" fill="var(--bone)">building across web &amp; mobile — React · Next.js · React Native · Node.js · Python · AI/ML.</text>
  <text class="mono rise a3" x="48" y="94" font-size="15.5" font-weight="500" fill="var(--muted)">drawn to projects where modern architecture meets high performance and intuitive UX.</text>

  <line class="rise a4" x1="48" y1="118" x2="952" y2="118" stroke="var(--rule)" stroke-width="1.5"/>

  <text class="mono rise a4" x="48"  y="150" font-size="13" font-weight="800" fill="var(--muted)" letter-spacing="3">FOCUS</text>
  <text class="mono rise a4" x="160" y="150" font-size="16" font-weight="700" fill="var(--bone)">Full-Stack Web · React Native Mobile · AI/ML Engineering · Cloud &amp; APIs</text>

  <text class="mono rise a5" x="48"  y="184" font-size="13" font-weight="800" fill="var(--muted)" letter-spacing="3">STATUS</text>
  <text class="mono rise a5" x="160" y="184" font-size="16" font-weight="700" fill="var(--accent)">working remotely worldwide · available for contract · open for collaboration</text>

  <text class="mono rise a6" x="48"  y="218" font-size="13" font-weight="800" fill="var(--muted)" letter-spacing="3">CERTS</text>
  <text class="mono rise a6" x="160" y="218" font-size="16" font-weight="700" fill="var(--bone)">Meta Advanced JavaScript · MERN Specialization · Full Stack Certified</text>
</svg>
